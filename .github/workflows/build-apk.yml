name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP archive if present
        run: |
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Unpacking $ZIP_FILE..."
              mkdir -p _unpacked
              unzip -o "$ZIP_FILE" -d _unpacked
              if [ -f "_unpacked/app/build.gradle" ] || [ -f "_unpacked/app/build.gradle.kts" ]; then
                cp -rn _unpacked/. . || cp -r _unpacked/* .
              else
                NESTED_DIR=$(find _unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
                if [ -n "$NESTED_DIR" ]; then
                  cp -rn "$NESTED_DIR"/. . || cp -r "$NESTED_DIR"/* .
                fi
              fi
              rm -rf _unpacked
            else
              echo "No Android project or .zip archive found."
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oblokogameing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
